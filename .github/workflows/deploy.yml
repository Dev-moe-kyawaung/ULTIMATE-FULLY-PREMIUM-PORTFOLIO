name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:   27M01tsuAZLdTNz2OFkm5eWiPd39VP3IsKTXwBRmwSWyU8ibT71FzhLN
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: nxQrutxKTfQ60aMcuZiw4WfR
          vercel-args: '--prod'
